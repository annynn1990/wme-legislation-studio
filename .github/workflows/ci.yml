name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/legislation
          ADMIN_PASSWORD: ci-test-password
          AUTH_SECRET: ci-test-secret-that-is-at-least-32-characters
